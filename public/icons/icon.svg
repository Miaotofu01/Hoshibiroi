<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <!-- 星拾 · Linear 风格图标（design-md 品牌 token）：
       canvas #010102 / primary #5e6ad2 / hairline #23252a / ink-muted #d0d6e0
       纪律：单强调色（薰衣草紫只用于品牌标记），无渐变、无辉光、无第二彩色 -->
  <rect width="128" height="128" rx="24" fill="#010102"/>
  <rect x="0.75" y="0.75" width="126.5" height="126.5" rx="23.25" fill="none" stroke="#23252a" stroke-width="1.5"/>

  <!-- 主星：薰衣草紫四角闪光（拾取生词 / 划词） -->
  <path d="M64 20 C64 42 90 52 106 57 C90 62 64 76 64 98 C64 76 38 62 22 57 C38 52 64 42 64 20 Z"
        fill="#5e6ad2"/>

  <!-- 划词条：中性灰，唯一的语义提示（无彩色） -->
  <rect x="40" y="106" width="48" height="8" rx="4" fill="#d0d6e0" opacity="0.6"/>
</svg>
